# Standalone compose for the Agent M42 Slack cockpit sidecar.
# Kept SEPARATE from the main docker-compose.yml so the weekly upstream rebase
# never conflicts with it (decoupled, rebase-immune).
#
# Deploy on the VPS from /opt/apps/paperclip/docker/slack-cockpit:
#   docker compose -f docker-compose.cockpit.yml up -d --build
#
# Requires (same dir):
#   .env.cockpit  — SLACK_BOT_TOKEN, SLACK_APP_TOKEN, GOOGLE_SA_JSON=/app/sa.json,
#                   SHEET_ID, SHEET_RANGE, COCKPIT_ALLOWLIST
#   sa.json       — Google service-account key (read-only, shared on the Sheet)

services:
  slack-cockpit:
    build: .
    image: agent-m42-slack-cockpit
    container_name: agent-m42-slack-cockpit
    restart: unless-stopped
    env_file: .env.cockpit
    volumes:
      - ./sa.json:/app/sa.json:ro
    # OBSERVABILITY ONLY — `restart: unless-stopped` does NOT act on health status;
    # the in-app watchdog (src/watchdog.ts) is what recovers a deaf socket, by
    # exiting the process. This healthcheck just makes a wedged Socket Mode link
    # VISIBLE in `docker ps` (the 2026-07-10 freeze was invisible for 4 days). The
    # app touches /tmp/cockpit-alive only while the link is believed up; stale => unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/cockpit-alive 2>/dev/null || echo 0) )) -lt 180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
